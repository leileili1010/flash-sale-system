<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Juniper Snooze, a fluffy lavender bunny with a flower crown, winking">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#FBF4FF"/>
      <stop offset="0.55" stop-color="#EBDDFF"/>
      <stop offset="1" stop-color="#D3C0FA"/>
    </radialGradient>
    <radialGradient id="fur" cx="42%" cy="32%" r="70%">
      <stop offset="0" stop-color="#EEE5FF"/>
      <stop offset="0.45" stop-color="#C7B1FA"/>
      <stop offset="1" stop-color="#9C7FE6"/>
    </radialGradient>
    <radialGradient id="puff" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#E9DEFF"/>
      <stop offset="0.6" stop-color="#BBA2F5"/>
      <stop offset="1" stop-color="#9677E0"/>
    </radialGradient>
    <radialGradient id="face" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFF8F3"/>
      <stop offset="1" stop-color="#FFE3D6"/>
    </radialGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD3E3"/>
      <stop offset="1" stop-color="#FF9EC0"/>
    </linearGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#4A3A6B"/>
      <stop offset="1" stop-color="#1C1430"/>
    </radialGradient>
    <radialGradient id="cloud" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1E9FF"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5B3FA8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>

  <!-- background sparkles and moon -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M120 110l6 22 22 6-22 6-6 22-6-22-22-6 22-6z"/>
    <path d="M680 160l4 15 15 4-15 4-4 15-4-15-15-4 15-4z"/>
    <path d="M610 70l3 10 10 3-10 3-3 10-3-10-10-3 10-3z"/>
  </g>
  <g fill="#FFD25E">
    <path d="M190 220l4 14 14 4-14 4-4 14-4-14-14-4 14-4z"/>
    <path d="M640 300l5 17 17 5-17 5-5 17-5-17-17-5 17-5z"/>
  </g>
  <path d="M700 70a46 46 0 1 0 40 72a38 38 0 1 1-40-72z" fill="#FFE59A" opacity="0.9"/>

  <!-- clouds -->
  <g fill="url(#cloud)">
    <circle cx="60" cy="560" r="110"/><circle cx="190" cy="585" r="100"/><circle cx="610" cy="590" r="105"/>
    <circle cx="745" cy="560" r="115"/><circle cx="400" cy="610" r="120"/>
  </g>

  <g filter="url(#soft)">
    <!-- ears -->
    <g transform="rotate(-14 330 190)">
      <path d="M330 40c-50 10-62 110-44 190l88 4c12-90 6-200-44-194z" fill="url(#fur)"/>
      <path d="M332 80c-28 8-34 82-22 140l46 2c8-66 4-146-24-142z" fill="url(#earInner)"/>
    </g>
    <g transform="rotate(14 470 190)">
      <path d="M470 40c50 10 62 110 44 190l-88 4c-12-90-6-200 44-194z" fill="url(#fur)"/>
      <path d="M468 80c28 8 34 82 22 140l-46 2c-8-66-4-146 24-142z" fill="url(#earInner)"/>
    </g>

    <!-- little tail and body -->
    <circle cx="545" cy="470" r="30" fill="url(#puff)"/>
    <ellipse cx="400" cy="460" rx="128" ry="86" fill="url(#fur)"/>
    <g fill="url(#puff)">
      <circle cx="292" cy="470" r="34"/><circle cx="508" cy="470" r="34"/>
      <circle cx="330" cy="520" r="34"/><circle cx="470" cy="520" r="34"/><circle cx="400" cy="532" r="36"/>
    </g>
    <!-- paws -->
    <ellipse cx="335" cy="440" rx="34" ry="28" fill="url(#puff)"/>
    <ellipse cx="465" cy="440" rx="34" ry="28" fill="url(#puff)"/>
    <ellipse cx="335" cy="446" rx="16" ry="12" fill="#FFD9E6"/>
    <ellipse cx="465" cy="446" rx="16" ry="12" fill="#FFD9E6"/>

    <!-- fluffy head -->
    <g fill="url(#puff)">
      <circle cx="560" cy="300" r="46"/><circle cx="548" cy="370" r="44"/><circle cx="505" cy="420" r="42"/>
      <circle cx="440" cy="440" r="42"/><circle cx="360" cy="440" r="42"/><circle cx="295" cy="420" r="42"/>
      <circle cx="252" cy="370" r="44"/><circle cx="240" cy="300" r="46"/><circle cx="258" cy="232" r="46"/>
      <circle cx="310" cy="185" r="46"/><circle cx="375" cy="165" r="46"/><circle cx="440" cy="168" r="46"/>
      <circle cx="500" cy="190" r="46"/><circle cx="545" cy="235" r="46"/>
    </g>
    <ellipse cx="400" cy="305" rx="160" ry="142" fill="url(#fur)"/>
  </g>

  <!-- face -->
  <ellipse cx="400" cy="330" rx="108" ry="92" fill="url(#face)"/>

  <!-- winking left eye -->
  <path d="M332 316q22-22 46 0" fill="none" stroke="#1C1430" stroke-width="9" stroke-linecap="round"/>
  <path d="M330 302l-10-8M336 296l-6-10" stroke="#1C1430" stroke-width="5" stroke-linecap="round"/>
  <!-- open right eye -->
  <ellipse cx="448" cy="312" rx="22" ry="27" fill="url(#eye)"/>
  <circle cx="456" cy="301" r="8" fill="#FFFFFF"/>
  <circle cx="441" cy="323" r="4" fill="#FFFFFF" opacity="0.85"/>
  <path d="M466 292l11-7M470 300l12-3" stroke="#1C1430" stroke-width="4.5" stroke-linecap="round"/>

  <!-- blush, nose, grin -->
  <ellipse cx="328" cy="356" rx="26" ry="15" fill="#FF8FB0" opacity="0.55"/>
  <ellipse cx="474" cy="356" rx="26" ry="15" fill="#FF8FB0" opacity="0.55"/>
  <path d="M394 338h12l-6 7z" fill="#FF7FA5" stroke="#FF7FA5" stroke-width="3" stroke-linejoin="round"/>
  <path d="M370 362q30 34 60 0q-30 10-60 0z" fill="#5A2440"/>
  <path d="M374 364l6 9 7-6 6 10 7-8 7 8 6-10 7 6 6-9q-28 8-52 0z" fill="#FFFFFF"/>
  <path d="M388 380q12 8 24 0q-12 4-24 0z" fill="#FF9EB8"/>

  <!-- flower crown -->
  <g>
    <path d="M276 216q124-70 248 0" fill="none" stroke="#6FBF7E" stroke-width="7" stroke-linecap="round"/>
    <g fill="#7FCF8E">
      <ellipse cx="300" cy="206" rx="14" ry="7" transform="rotate(-30 300 206)"/>
      <ellipse cx="352" cy="180" rx="14" ry="7" transform="rotate(-15 352 180)"/>
      <ellipse cx="448" cy="180" rx="14" ry="7" transform="rotate(15 448 180)"/>
      <ellipse cx="500" cy="206" rx="14" ry="7" transform="rotate(30 500 206)"/>
    </g>
    <g id="yellow-flower">
      <g fill="#FFD45E">
        <circle cx="400" cy="152" r="13"/><circle cx="419" cy="166" r="13"/><circle cx="412" cy="188" r="13"/>
        <circle cx="388" cy="188" r="13"/><circle cx="381" cy="166" r="13"/>
      </g>
      <circle cx="400" cy="172" r="10" fill="#FFA53A"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="326" cy="182" r="10"/><circle cx="341" cy="190" r="10"/><circle cx="337" cy="206" r="10"/>
      <circle cx="320" cy="207" r="10"/><circle cx="314" cy="193" r="10"/>
      <circle cx="474" cy="182" r="10"/><circle cx="486" cy="193" r="10"/><circle cx="480" cy="207" r="10"/>
      <circle cx="463" cy="206" r="10"/><circle cx="459" cy="190" r="10"/>
    </g>
    <circle cx="328" cy="195" r="7" fill="#FFC23D"/>
    <circle cx="472" cy="195" r="7" fill="#FFC23D"/>
    <g fill="#FFB5CF">
      <circle cx="285" cy="226" r="9"/><circle cx="296" cy="234" r="9"/><circle cx="288" cy="244" r="9"/><circle cx="277" cy="238" r="9"/>
      <circle cx="515" cy="226" r="9"/><circle cx="524" cy="238" r="9"/><circle cx="512" cy="244" r="9"/><circle cx="504" cy="234" r="9"/>
    </g>
    <circle cx="287" cy="235" r="5" fill="#FF7FA5"/>
    <circle cx="513" cy="235" r="5" fill="#FF7FA5"/>
  </g>
</svg>
