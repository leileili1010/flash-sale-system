spring:
  application:
    name: flash-sale-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flashsale}
    username: ${DB_USER:flashsale}
    password: ${DB_PASSWORD:flashsale}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        # Fail fast when the broker is unreachable so a purchase is rejected in seconds, not minutes.
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 4000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: ${ORDER_CONSUMER_CONCURRENCY:3}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

flashsale:
  demo:
    # Creates a demo release schedule (relative to now) when no live or upcoming drop exists.
    seed-drops: ${DEMO_SEED_DROPS:true}
    # Creates the demo admin and shopper accounts if they do not exist.
    seed-users: ${DEMO_SEED_USERS:true}
  security:
    jwt:
      issuer: flash-sale-system
      # Base64-encoded HMAC key of at least 32 bytes. The default is for local development only;
      # always set JWT_SECRET in any shared environment.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1hbnktc2hhcmVkLWVudg==}
      ttl: ${JWT_TTL:2h}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  inventory:
    # How often published drops are (re)loaded into Redis.
    preheat-interval: ${INVENTORY_PREHEAT_INTERVAL:30s}
  orders:
    # Time a customer has to pay before the reserved unit is released.
    payment-window: ${ORDER_PAYMENT_WINDOW:10m}
    publish-timeout: ${ORDER_PUBLISH_TIMEOUT:5s}
  rate-limit:
    purchase:
      per-user-capacity: ${RATE_LIMIT_USER_CAPACITY:5}
      per-user-period: ${RATE_LIMIT_USER_PERIOD:10s}
      global-per-second: ${RATE_LIMIT_GLOBAL_PER_SECOND:5000}
  id:
    # Unique per running instance (0-1023); used by the Snowflake order-number generator.
    worker-id: ${WORKER_ID:1}
